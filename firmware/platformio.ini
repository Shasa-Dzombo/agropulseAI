; PlatformIO Project Configuration File
; ==========================================
;
; AgroPulse IoT Sensor Node - ESP32 Firmware
;
; Build profiles:
; - esp32dev: Standard ESP32-WROOM-32D
; - esp32s3: ESP32-S3 with more RAM (optional upgrade)
;
; Usage:
;   pio run -e esp32dev          # Build
;   pio run -e esp32dev -t upload # Upload via USB
;   pio run -e esp32dev -t uploadfs # Upload SPIFFS
;   pio run -t monitor           # Serial monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Clock speed
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Flash size
board_build.flash_mode = dio
board_upload.flash_size = 4MB

; Partition scheme (OTA support)
board_build.partitions = default.csv

; Serial monitor
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time
    colorize

; Upload settings
upload_speed = 921600
upload_port = COM3  ; Change to your port

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_LOOP_STACK_SIZE=8192
    -DWDT_TIMEOUT=30
    -DLORA_FREQUENCY=433E6
    -DNODE_ADDRESS=0x01

; Library dependencies
lib_deps = 
    ; LoRa communication
    sandeepmistry/LoRa@^0.8.0
    
    ; Sensors
    adafruit/Adafruit BME280 Library@^2.2.2
    claws/BH1750@^1.3.0
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit INA219@^1.2.0
    adafruit/Adafruit BusIO@^1.14.1
    
    ; Data handling
    bblanchon/ArduinoJson@^6.21.3
    
    ; Web server for OTA
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    
    ; File systems
    arduino-libraries/SD@^1.2.4
    
    ; TensorFlow Lite
    eloquentarduino/EloquentTinyML@^0.0.9
    
    ; Utilities
    Wire
    SPI
    WiFi
    HTTPClient
    Update
    SPIFFS

; Filesystem (SPIFFS for model storage)
board_build.filesystem = spiffs

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Extended features for S3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi

; More PSRAM available
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DWDT_TIMEOUT=30

lib_deps = ${env:esp32dev.lib_deps}

; Testing configuration
[env:test]
platform = native
test_framework = unity
build_flags = 
    -std=gnu++17
    -DUNIT_TEST
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
