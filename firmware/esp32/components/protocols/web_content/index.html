<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroPulse Device Setup</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c5b4c; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="password"], select {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus, select:focus { border-color: #4a9080; outline: none; }
        .btn {
            display: inline-block; width: 100%; background-color: #4a9080; color: white; padding: 14px 20px; margin: 8px 0; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 600; transition: background-color 0.3s;
        }
        .btn:hover { background-color: #3b7366; }
        .btn-secondary { background-color: #777; }
        .btn-secondary:hover { background-color: #666; }
        .wifi-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
        .wifi-list li { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .wifi-list li:last-child { border-bottom: none; }
        .wifi-list li:hover { background-color: #e8f0fe; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4a9080; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status { padding: 15px; border-radius: 4px; margin-top: 20px; text-align: center; display: none; }
        .status.success { background-color: #d4edda; color: #155724; }
        .status.error { background-color: #f8d7da; color: #721c24; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 AgroPulse Device Setup</h1>
        <div id="scan-section">
            <p>Scan for available Wi-Fi networks to connect your device to the internet.</p>
            <button id="scan-btn" class="btn">Scan for Wi-Fi</button>
            <div id="loader" class="loader"></div>
            <ul id="wifi-list" class="wifi-list"></ul>
        </div>
        <div id="config-section" class="hidden">
            <form id="config-form">
                <div class="form-group">
                    <label for="ssid">Wi-Fi Network (SSID)</label>
                    <input type="text" id="ssid" name="ssid" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>
                <button type="submit" class="btn">Save & Connect</button>
                <button type="button" id="back-btn" class="btn btn-secondary">Back to Scan</button>
            </form>
        </div>
        <div id="status" class="status"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const scanSection = document.getElementById('scan-section');
            const configSection = document.getElementById('config-section');
            const scanBtn = document.getElementById('scan-btn');
            const backBtn = document.getElementById('back-btn');
            const wifiList = document.getElementById('wifi-list');
            const loader = document.getElementById('loader');
            const configForm = document.getElementById('config-form');
            const ssidInput = document.getElementById('ssid');
            const statusDiv = document.getElementById('status');

            scanBtn.addEventListener('click', async () => {
                loader.style.display = 'block';
                wifiList.innerHTML = '';
                statusDiv.style.display = 'none';
                try {
                    const response = await fetch('/api/scan');
                    const networks = await response.json();
                    networks.forEach(net => {
                        const li = document.createElement('li');
                        li.textContent = `${net.ssid} (${net.rssi} dBm)`;
                        li.dataset.ssid = net.ssid;
                        li.addEventListener('click', () => {
                            ssidInput.value = net.ssid;
                            scanSection.classList.add('hidden');
                            configSection.classList.remove('hidden');
                        });
                        wifiList.appendChild(li);
                    });
                } catch (e) {
                    showStatus('Failed to scan for networks. Please try again.', 'error');
                } finally {
                    loader.style.display = 'none';
                }
            });

            backBtn.addEventListener('click', () => {
                configSection.classList.add('hidden');
                scanSection.classList.remove('hidden');
            });

            configForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(configForm);
                const data = Object.fromEntries(formData.entries());
                
                showStatus('Attempting to connect...', 'success');
                configForm.style.display = 'none';

                try {
                    const response = await fetch('/api/configure', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        showStatus('Configuration saved! The device will now restart and attempt to connect to the new network.', 'success');
                    } else {
                        const errorText = await response.text();
                        showStatus(`Failed to save configuration: ${errorText}`, 'error');
                        configForm.style.display = 'block';
                    }
                } catch (e) {
                    showStatus('An error occurred while sending the configuration.', 'error');
                    configForm.style.display = 'block';
                }
            });

            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = `status ${type}`;
                statusDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
